# Adapter Field Mapping Configuration
# Maps incoming custom hardware/dashboard field names to internal Contract v1 schema.

field_mapping:
  mpu6050:
    accel_x: "ax"
    accel_y: "ay"
    accel_z: "az"
    gyro_x: "gx"
    gyro_y: "gy"
    gyro_z: "gz"
  bmp280:
    press: "pressure"
    alt: "altitude"
  gps:
    lat: "latitude"
    lon: "longitude"
    spd: "speed"
    status: "fix"
  battery:
    v_bat: "voltage"
